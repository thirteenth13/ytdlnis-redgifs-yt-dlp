name: Build patched yt-dlp

on:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * *"

permissions:
  contents: write

concurrency:
  group: patched-yt-dlp
  cancel-in-progress: false

jobs:
  build-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout patch repository
        uses: actions/checkout@v4

      - name: Clone current yt-dlp
        run: |
          git clone --depth=1 https://github.com/yt-dlp/yt-dlp.git upstream

      - name: Apply RedGifs and TikTok patches
        working-directory: upstream
        run: |
          python ../patch_redgifs.py
          python ../patch_tiktok.py
          python ../patch_tiktok_retry.py
          python ../patch_tiktok_feed_fallback.py
          python ../patch_image_default_format.py
          python -m py_compile yt_dlp/extractor/redgifs.py
          python -m py_compile yt_dlp/extractor/tiktok.py
          python -m py_compile yt_dlp/YoutubeDL.py
          grep -n -A5 -B2 "musical_ly/35.1.3/2023501030/1233" yt_dlp/extractor/tiktok.py
          grep -n -A12 -B2 "_parse_aweme_slideshow_app" yt_dlp/extractor/tiktok.py
          grep -n -A5 -B2 "retrying TikTok app API with a fresh device session" yt_dlp/extractor/tiktok.py
          grep -n -A8 -B2 "trying TikTok user-feed fallback" yt_dlp/extractor/tiktok.py
          grep -n -A4 -B2 "return '\*\[vcodec=images\]'" yt_dlp/YoutubeDL.py

      - name: Verify image-only default selector
        working-directory: upstream
        run: |
          python - <<'PY'
          from yt_dlp import YoutubeDL
          ydl = YoutubeDL({'quiet': True})
          info = {'formats': [{
              'format_id': '0',
              'url': 'https://example.invalid/image.jpg',
              'ext': 'jpeg',
              'vcodec': 'images',
              'acodec': 'none',
          }]}
          got = ydl._default_format_spec(info)
          assert got == '*[vcodec=images]', got
          print('Image-only default selector smoke test: OK ->', got)
          PY

      - name: Set build version and origin
        id: version
        working-directory: upstream
        shell: bash
        run: |
          VERSION="$(date -u +'%Y.%m.%d.%H%M%S')"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          python devscripts/update-version.py -c stable -r "${GITHUB_REPOSITORY}" "${VERSION}"

      - name: Build platform-independent yt-dlp
        working-directory: upstream
        run: |
          python devscripts/make_lazy_extractors.py
          make yt-dlp
          chmod +x yt-dlp
          ./yt-dlp --version

      - name: Verify built executable contains image selector patch
        working-directory: upstream
        run: |
          ./yt-dlp --help >/dev/null
          python - <<'PY'
          import zipfile
          z = zipfile.ZipFile('yt-dlp')
          data = z.read('yt_dlp/YoutubeDL.py').decode('utf-8')
          assert "return '*[vcodec=images]'" in data
          tiktok = z.read('yt_dlp/extractor/tiktok.py').decode('utf-8')
          assert 'trying TikTok user-feed fallback' in tiktok
          print('Built yt-dlp contains image selector and TikTok user-feed fallback: OK')
          PY

      - name: Create updater metadata
        working-directory: upstream
        shell: bash
        run: |
          sha256sum yt-dlp > SHA2-256SUMS
          curl -fL \
            https://github.com/yt-dlp/yt-dlp/releases/latest/download/_update_spec \
            -o _update_spec

      - name: Smoke-test RedGifs patch
        working-directory: upstream
        shell: bash
        run: |
          python - <<'PY'
          from yt_dlp.extractor.redgifs import RedGifsBaseIE
          sample = {
              'id': 'CloudyIgnorantGhostShrimp',
              'height': 720,
              'width': 1280,
              'urls': {
                  'hd': 'https://example.invalid/video.mp4',
                  'poster': 'https://example.invalid/poster.jpg',
              },
              'tags': ['test'],
          }
          ie = object.__new__(RedGifsBaseIE)
          info = ie._parse_gif_data(sample)
          assert info['thumbnail'] == 'https://example.invalid/poster.jpg', info
          print('RedGifs thumbnail smoke test: OK')
          PY

      - name: Smoke-test TikTok slideshow parser
        working-directory: upstream
        shell: bash
        run: |
          python - <<'PY'
          from yt_dlp.extractor.tiktok import TikTokBaseIE
          sample = {
              'aweme_id': '123456789',
              'desc': 'test slideshow',
              'image_post_info': {
                  'images': [
                      {'display_image': {'url_list': ['https://example.invalid/1.jpg']}},
                      {'download_url': {'url_list': ['https://example.invalid/2.webp']}},
                  ],
              },
          }
          ie = object.__new__(TikTokBaseIE)
          result = ie._parse_aweme_slideshow_app(sample)
          assert result['_type'] == 'playlist', result
          entries = list(result['entries'])
          assert len(entries) == 2, entries
          assert entries[0]['url'].endswith('/1.jpg'), entries
          assert entries[1]['url'].endswith('/2.webp'), entries
          print('TikTok slideshow smoke test: OK')
          PY

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        working-directory: upstream
        shell: bash
        run: |
          gh release create "${VERSION}" \
            yt-dlp \
            SHA2-256SUMS \
            _update_spec \
            --repo "${GITHUB_REPOSITORY}" \
            --title "Patched yt-dlp ${VERSION}" \
            --notes "yt-dlp master with RedGifs thumbnail support and TikTok video/slideshow support, conservative retries, image-only selection, and user-feed fallback." \
            --latest

          # Keep all previous releases/tags.
